name: Build Android APK with Verification Gate

'on':
  push:
    branches: [main, master, fix/refresh-live-gate-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 定位專案目錄
        id: locate-project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            PROJECT_DIR='.'
          elif [[ -f martin_luk_app/pubspec.yaml ]]; then
            PROJECT_DIR='martin_luk_app'
          else
            echo '::error::找不到 Flutter 專案的 pubspec.yaml'
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: 初始化驗證紀錄
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          mkdir -p test_logs
          printf '%s\n' 'CI 開始；真實行情門禁尚未執行。' > test_logs/verification.log

      - name: 檢查測試與畫面檔案是否齊全
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a test_logs/verification.log
          from pathlib import Path
          import os
          import re
          workflow_path = Path('.github/workflows/build_apk.yml')
          if not workflow_path.is_file():
              workflow_path = Path(os.environ.get('GITHUB_WORKSPACE', '.')) / workflow_path
          workflow = workflow_path.read_text(encoding='utf-8')
          required = {
              'pubspec.yaml', 'lib/main.dart', 'lib/app_controller.dart',
              'lib/screens/dashboard_screen.dart', 'lib/screens/calculator_screen.dart',
              'lib/services/background_scan_service.dart',
              'android/app/src/main/AndroidManifest.xml',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/MainActivity.kt',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/ScanServiceBridge.kt',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/ScanForegroundService.kt',
              'android/app/src/main/res/drawable/ic_stat_scan.xml',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/MartinLukApplication.kt',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/CacheRecoveryActivity.kt',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/FlutterHostActivity.kt',
              'android/app/src/main/kotlin/com/martinluk/martin_luk_app/LegacyQuoteCacheRecovery.kt',
              'android/app/src/test/kotlin/com/martinluk/martin_luk_app/LegacyQuoteCacheXmlTest.kt',
          }
          required.update(re.findall(r'\btest/[A-Za-z0-9_/-]+\.dart\b', workflow))
          missing = sorted(path for path in required
                           if not Path(path).is_file() or Path(path).stat().st_size == 0)
          for path in missing:
              print(f'::error file={path}::缺少或為空：{path}；請依原路徑補齊完整檔案。')
          if missing:
              raise SystemExit(1)
          print(f'[PASS] 建置畫面及工作流引用的測試檔案齊全（{len(required)} 個）。')
          PY

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安裝 Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 升級 Gradle Wrapper 至 8.14
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_FILE='android/gradle/wrapper/gradle-wrapper.properties'
          if [[ ! -f "$WRAPPER_FILE" ]]; then
            echo '::error::缺少 gradle-wrapper.properties'
            exit 1
          fi
          if ! grep -Eq '^distributionUrl=.*gradle-8\.14-(all|bin)\.zip$' "$WRAPPER_FILE"; then
            if grep -Eq '^distributionSha256Sum=' "$WRAPPER_FILE"; then
              echo '::error::Wrapper 有 SHA256 校驗值，升級 Gradle 時須一併更新對應校驗值。'
              exit 1
            fi
            sed -i -E 's#(gradle-)[0-9.]+-(all|bin)\.zip#\18.14-\2.zip#' "$WRAPPER_FILE"
          fi
          grep -E '^distributionUrl=.*gradle-8\.14-(all|bin)\.zip$' "$WRAPPER_FILE" | tee -a test_logs/verification.log

      - name: 下載依賴套件
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee -a test_logs/verification.log

      - name: 驗證離線搜尋字典與多市場身份
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_stock_search.py --check 2>&1 | tee -a test_logs/verification.log
          node scripts/check_stock_search.cjs 2>&1 | tee -a test_logs/verification.log

      - name: 驗證 Python 背景掃描與快照 API
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r backend/requirements-dev.txt 2>&1 | tee -a test_logs/verification.log
          python3 -m unittest discover -s backend/tests -v 2>&1 | tee -a test_logs/verification.log

      - name: 驗證風控、RS 與門禁報告規則
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee -a test_logs/verification.log
          flutter test test/rs_alignment_test.dart test/live_strategy_engine_test.dart test/live_risk_helpers_test.dart test/strategy_engine_test.dart test/trade_levels_test.dart test/manual_trade_levels_test.dart test/recommendation_trade_levels_test.dart --dart-define=USE_MOCK_DATA=false --reporter=expanded 2>&1 | tee -a test_logs/verification.log
          flutter test test/us_stock_directory_test.dart test/us_universe_fallback_test.dart test/network_request_test.dart test/expanded_symbol_test.dart test/rolling_scan_snapshot_test.dart test/stock_universe_service_test.dart test/backend_snapshot_repository_test.dart test/backend_scan_controller_test.dart test/candidate_repository_test.dart test/backend_transport_timeout_test.dart test/backend_connection_service_test.dart test/backend_setup_settings_test.dart test/dashboard_scope_test.dart test/mobile_tw_rolling_repository_test.dart test/mobile_tw_polling_test.dart test/core_market_pool_test.dart test/live_repositories_test.dart --dart-define=USE_MOCK_DATA=false --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 驗證台股官方備援、名單穩定及跨重啟續掃
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/tw_issuer_csv_test.dart test/tw_official_fallback_test.dart test/tw_universe_stability_test.dart test/tw_universe_resume_integration_test.dart --dart-define=USE_MOCK_DATA=false --timeout=60s --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 驗證 Android 背景服務與前台生命週期
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/background_scan_uninitialized_test.dart test/background_scan_service_test.dart test/background_scan_controller_test.dart test/background_scan_settings_test.dart test/background_scan_app_lifecycle_test.dart test/production_lifecycle_test.dart test/portfolio_controller_test.dart --dart-define=USE_MOCK_DATA=false --timeout=90s --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 驗證美股完整名單分批輪掃、跨重啟與畫面進度
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/mobile_us_rolling_repository_test.dart test/mobile_us_polling_test.dart test/mobile_us_scope_test.dart test/market_scan_progress_test.dart test/production_ui_test.dart --dart-define=USE_MOCK_DATA=false --timeout=90s --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 驗證長時間行情快取上限與輪掃存檔負荷
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/market_data_cache_bounds_test.dart test/mobile_scan_storage_budget_test.dart test/market_data_api_test.dart test/market_transport_regression_test.dart test/refresh_recovery_test.dart --dart-define=USE_MOCK_DATA=false --timeout=90s --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 執行真實行情與指標門禁測試（允許零推薦）
        id: run-gate-test
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f test/integration_scan_test.dart ]]; then
            echo '::error::缺少 test/integration_scan_test.dart，請先提交測試檔。' | tee -a test_logs/verification.log
            exit 1
          fi
          mkdir -p build
          rm -f build/live-scan-evidence.json
          flutter test test/integration_scan_test.dart --dart-define=RUN_LIVE_SCAN_TEST=true --timeout=90s --dart-define=USE_MOCK_DATA=false --reporter=expanded 2>&1 | tee -a test_logs/verification.log
          python3 scripts/validate_live_scan_evidence.py build/live-scan-evidence.json 2>&1 | tee -a test_logs/verification.log
          flutter test test/us_universe_http_smoke_test.dart --dart-define=RUN_LIVE_UNIVERSE_TEST=true --dart-define=USE_MOCK_DATA=false --timeout=30s --reporter=expanded 2>&1 | tee -a test_logs/verification.log

      - name: 編譯正式版 Release APK
        if: ${{ success() && steps.run-gate-test.outcome == 'success' }}
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: flutter build apk --release --dart-define=USE_MOCK_DATA=false --android-skip-build-dependency-validation

      - name: 驗證原生啟動復原保留帳戶與持股
        id: native-recovery-test
        if: ${{ success() && steps.run-gate-test.outcome == 'success' }}
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee -a ../test_logs/verification.log

      - name: 保存實測紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-live-scan-evidence
          path: '**/test_logs/verification.log'
          if-no-files-found: warn
          retention-days: 7

      - name: 上傳 APK 成品
        if: ${{ success() && steps.native-recovery-test.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-app-release
          path: '**/build/app/outputs/flutter-apk/*.apk'
          if-no-files-found: error
          retention-days: 7
