name: Build verified market scan APK
'on':
  push:
    branches: [main, master, fix/refresh-live-gate-20261014]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            echo 'path=.' >> "$GITHUB_OUTPUT"
          elif [[ -f martin_luk_app/pubspec.yaml ]]; then
            echo 'path=martin_luk_app' >> "$GITHUB_OUTPUT"
          else
            echo 'No pubspec.yaml found.' >&2
            exit 1
          fi

      - name: Apply 10-second market scan fix
        working-directory: ${{ steps.project.outputs.path }}
        run: python3 scripts/apply_market_scan_timeout_fix.py --project . --zip build/market-scan-updated-source.zip
        
      - name: Upload complete updated source files
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-market-scan-updated-source
          path: ${{ steps.project.outputs.path }}/build/market-scan-updated-source.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/backend/requirements-dev.txt'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify backend and offline preview
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m unittest discover -s backend/tests -v
          python scripts/sync_stock_search.py --check
          node scripts/check_stock_search.cjs
          python scripts/check_preview.py
          node scripts/check_preview_ui.cjs
          node scripts/check_portfolio_preview.cjs
          node scripts/check_standalone_preview.cjs
          python scripts/check_portfolio_parity.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - name: Prepare Android and Web
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          python3 scripts/prepare_android.py
          flutter config --enable-web
          python3 scripts/check_web.py

      - name: Analyze and test
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Verify fresh live recommendation gate
        id: live-scan
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter test test/integration_scan_test.dart --dart-define=RUN_LIVE_SCAN_TEST=true --timeout=60s --dart-define=USE_MOCK_DATA=false 2>&1 | tee build/live-scan.log
          test -s build/live-scan-evidence.json

      - name: Upload live scan evidence
        if: ${{ always() && (steps.live-scan.outcome == 'success' || steps.live-scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-live-scan-evidence
          path: |
            ${{ steps.project.outputs.path }}/build/live-scan-evidence.json
            ${{ steps.project.outputs.path }}/build/live-scan.log
          if-no-files-found: error
          retention-days: 7

      - name: Build Production Release APK
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --release --dart-define=USE_MOCK_DATA=false --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
          retention-days: 7

      - name: Build Web preview
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=USE_MOCK_DATA=false
          cp web/phone_preview.html build/web/phone_preview.html

      - name: Upload Web preview
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-production-web
          path: ${{ steps.project.outputs.path }}/build/web/
          if-no-files-found: error
          retention-days: 14
