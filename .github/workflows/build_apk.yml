name: Build Production APK and Web

'on':
  push:
    branches: [main, master, fix/refresh-live-gate-20261014]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            echo 'path=.' >> "$GITHUB_OUTPUT"
          elif [[ -f martin_luk_app/pubspec.yaml ]]; then
            echo 'path=martin_luk_app' >> "$GITHUB_OUTPUT"
          else
            echo 'No pubspec.yaml found at repository root or martin_luk_app/.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/backend/requirements.txt
            **/backend/requirements-dev.txt

      - name: Set up Node for offline preview checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend test dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend risk, holdings, quotes and API
        working-directory: ${{ steps.project.outputs.path }}
        run: python -m unittest discover -s backend/tests -v

      - name: Test production offline HTML and engine parity
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          python scripts/sync_stock_search.py --check
          node scripts/check_stock_search.cjs
          python scripts/check_preview.py
          node scripts/check_preview_ui.cjs
          node scripts/check_portfolio_preview.cjs
          node scripts/check_standalone_preview.cjs
          python scripts/check_portfolio_parity.py

  build:
    needs: strategy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            echo 'path=.' >> "$GITHUB_OUTPUT"
          elif [[ -f martin_luk_app/pubspec.yaml ]]; then
            echo 'path=martin_luk_app' >> "$GITHUB_OUTPUT"
          else
            echo 'No pubspec.yaml found at repository root or martin_luk_app/.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - name: Restore official Gradle wrapper
        working-directory: ${{ steps.project.outputs.path }}
        run: python3 scripts/prepare_android.py

      - name: Enable and check Flutter Web
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter config --enable-web
          python3 scripts/check_web.py

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter analyze

      - name: Run unit and widget tests
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter test

      # Mandatory live gate. Failure or zero qualified candidates stops
      # this job before flutter build apk.
      - name: Verify fresh live market scan before APK build
        id: live-scan
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter test test/integration_scan_test.dart --dart-define=RUN_LIVE_SCAN_TEST=true --timeout=60s 2>&1 | tee build/live-scan.log
          test -s build/live-scan-evidence.json

      - name: Upload live scan evidence and diagnostic log
        if: ${{ always() && (steps.live-scan.outcome == 'success' || steps.live-scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-live-scan-evidence
          path: |
            ${{ steps.project.outputs.path }}/build/live-scan-evidence.json
            ${{ steps.project.outputs.path }}/build/live-scan.log
          if-no-files-found: error
          retention-days: 7

      # Default success condition is intentional: no always() and no
      # continue-on-error on the APK build.
      - name: Build connected Production Release APK
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --release --dart-define=USE_MOCK_DATA=false --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
          retention-days: 7

      - name: Build connected Flutter Web
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=USE_MOCK_DATA=false
          cp web/phone_preview.html build/web/phone_preview.html

      - name: Upload Flutter Web preview
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-production-web
          path: ${{ steps.project.outputs.path }}/build/web/
          if-no-files-found: error
          retention-days: 14
