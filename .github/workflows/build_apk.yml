name: Build Android APK with Verification Gate

on:
  push:
    branches: [ main, master, fix/refresh-live-gate-20261014 ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安裝 Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 定位專案目錄
        id: locate-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::找不到 pubspec.yaml"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: 自動升級 Gradle Wrapper
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_FILE" ]; then
            sed -i 's/gradle-.*-all.zip/gradle-8.14-all.zip/g' "$WRAPPER_FILE"
            sed -i 's/gradle-.*-bin.zip/gradle-8.14-bin.zip/g' "$WRAPPER_FILE"
          fi

      - name: 下載依賴套件
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: flutter pub get

      - name: 執行真實連網與策略推薦門禁測試
        id: run-gate-test
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          mkdir -p test_logs
          echo "開始執行真實連線驗證測試..."
          flutter test test/integration_scan_test.dart --timeout=90s 2>&1 | tee test_logs/verification.log

      - name: 保存實測紀錄 (不論成功失敗均保留)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-live-scan-evidence
          path: '**/test_logs/verification.log'
          retention-days: 7

      - name: 編譯正式版 Release APK (僅在門禁測試通過後執行)
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          flutter build apk --release --dart-define=USE_MOCK_DATA=false --android-skip-build-dependency-validation

      - name: 上傳 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: martin-luk-app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          retention-days: 7
