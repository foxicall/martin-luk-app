plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Flutter's plugin must follow the Android and Kotlin plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = signingPropertiesFile.exists()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!signingProperties.getProperty(key)) {
            throw new GradleException("Missing ${key} in android/key.properties")
        }
    }
}

android {
    namespace = 'com.martinluk.martin_luk_app'
    // shared_preferences_android requires API 36 at compile time.
    // This does not change the supported Android versions or target SDK.
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    ndkVersion = '27.0.12077973'

    compileOptions {
        // Required by flutter_local_notifications 18 for java.time support.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = 'com.martinluk.martin_luk_app'
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // Paths are resolved relative to android/, avoiding app/ ambiguity.
                storeFile = rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword = signingProperties.getProperty('storePassword')
                keyAlias = signingProperties.getProperty('keyAlias')
                keyPassword = signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // A demonstration release APK is installable with debug signing.
            // Configure key.properties before distributing a production release.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    // The Android runtime provides XmlPullParser. JVM migration tests use its
    // standalone implementation without creating an Android/Flutter engine.
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
