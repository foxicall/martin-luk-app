pluginManagement {
    // Flutter writes android/local.properties with flutter.sdk during a build.
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = file('local.properties')
        if (!propertiesFile.exists()) {
            throw new GradleException('Run flutter pub get/build from the project root, or set flutter.sdk in android/local.properties.')
        }
        propertiesFile.withInputStream { properties.load(it) }
        def path = properties.getProperty('flutter.sdk')
        assert path != null : 'flutter.sdk not set in android/local.properties'
        return path
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    // Aligned with Flutter 3.47.7, Gradle 8.14 and JDK 17 in CI.
    id 'com.android.application' version '8.11.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

include ':app'
